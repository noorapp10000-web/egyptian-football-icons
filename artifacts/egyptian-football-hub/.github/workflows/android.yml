name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "رابط التطبيق المنشور اللي الـAPK يفتحه"
        required: false
        default: "https://project--fed06797-85e0-46bd-acbd-d420b4b17003.lovable.app"
  push:
    tags:
      - "v*"

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      CAP_SERVER_URL: ${{ github.event.inputs.server_url || 'https://project--fed06797-85e0-46bd-acbd-d420b4b17003.lovable.app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Capacitor android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: masrawy-fan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
