name: Build Flutter Android App

on:
  workflow_dispatch:
  push:
    branches:
      - replit-agent/flutter-app

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    env:
      API_BASE_URL: ${{ secrets.FLUTTER_API_BASE_URL }}
      FIREBASE_API_KEY: ${{ secrets.FLUTTER_FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ secrets.FLUTTER_FIREBASE_APP_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FLUTTER_FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FLUTTER_FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FLUTTER_FIREBASE_STORAGE_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Validate release configuration
        run: |
          test -n "$API_BASE_URL" || (echo "Missing FLUTTER_API_BASE_URL" && exit 1)
          test -n "$FIREBASE_API_KEY" || (echo "Missing FLUTTER_FIREBASE_API_KEY" && exit 1)
          test -n "$FIREBASE_APP_ID" || (echo "Missing FLUTTER_FIREBASE_APP_ID" && exit 1)
          test -n "$FIREBASE_MESSAGING_SENDER_ID" || (echo "Missing FLUTTER_FIREBASE_MESSAGING_SENDER_ID" && exit 1)
          test -n "$FIREBASE_PROJECT_ID" || (echo "Missing FLUTTER_FIREBASE_PROJECT_ID" && exit 1)

      - name: Analyze Dart
        run: flutter analyze

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-number="${{ github.run_number }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: masrawy-fan-flutter-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error